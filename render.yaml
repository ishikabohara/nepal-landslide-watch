# Free read-only web service. GitHub Actions publishes the runtime archive.
services:
  - type: web
    name: nepal-landslide-watch
    runtime: docker
    plan: free
    dockerCommand: python -m scripts.start_free_service
    healthCheckPath: /healthz
    envVars:
      - key: NEPAL_DATA_DIR
        value: /app/data
      - key: NEPAL_WORKER_ENABLED
        value: "0"
      - key: PYTHONUNBUFFERED
        value: "1"
